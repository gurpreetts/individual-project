<!DOCTYPE html>
<html>
<head>
  <title>Unit Converter</title>
  <script src="script.js"></script>
</head>
<body>
  <h2>Unit Converter</h2>
  <input id="value" type="number" placeholder="Enter value">
  <button onclick="cmToM()">cm → m</button>
  <button onclick="mToCm()">m → cm</button>
  <button onclick="mToKm()">m → km</button>
  <button onclick="kmToM()">km → m</button>
  <p id="convertResult"></p>
</body>
</html>
